server:
  port: ${SERVER_PORT:8080}
  tomcat:
    accesslog:
      enabled: false
      directory: access-logs
      prefix: access_log
      suffix: .log
      file-date-format: .yyyy-MM-dd
      pattern: '%h %l %u %t "%r" %s %b %D'
      rotate: true
      max-days: 7

spring:
  application:
    name: pragatix-backend
  main:
    banner-mode: "off"
    log-startup-info: false
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/spdms_lab?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:sharu}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  security:
    user:
      name: admin
      password: admin

jwt:
  secret: ${JWT_SECRET:spdms_super_secret_key_must_be_at_least_256_bits_long_for_hs256_algorithm}
  expiration: ${JWT_EXPIRATION:57600000}
  student-expiration: ${JWT_STUDENT_EXPIRATION:57600000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://pragatix.in,https://www.pragatix.in,http://localhost:8080,http://localhost:5173}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /api/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /api/swagger-ui.html
    tags-sorter: alpha

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
  level:
    root: WARN
    org.springframework: WARN
    org.springframework.boot: WARN
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.apache.catalina: WARN
    org.apache.tomcat: WARN
    com.zaxxer.hikari: WARN
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql: OFF
    org.hibernate: ERROR
    jjcet.PragatiX: INFO
    com.pragatix: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
  health:
    db:
      enabled: true

