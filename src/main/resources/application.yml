server:
  port: 8080

spring:
  application:
    name: spdms-backend

  datasource:
    url: jdbc:mysql://localhost:3306/spdms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: venkat@2007VK
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # Disable default Security auto-config password log
  security:
    user:
      name: admin
      password: admin

# JWT Configuration
jwt:
  secret: spdms_super_secret_key_must_be_at_least_256_bits_long_for_hs256_algorithm
  expiration: 86400000       # 24 hours in milliseconds
  student-expiration: 43200000  # 12 hours in milliseconds

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

logging:
  level:
    com.spdms: DEBUG
    org.springframework.security: INFO
