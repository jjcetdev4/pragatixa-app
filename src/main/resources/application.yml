server:
  port: ${SERVER_PORT}
  forward-headers-strategy: framework
  tomcat:
    accesslog:
      enabled: false
      directory: access-logs
      prefix: access_log
      suffix: .log
      file-date-format: .yyyy-MM-dd
      pattern: '%h %l %u %t "%r" %s %b %D'
      rotate: true
      max-days: 7

spring:
  application:
    name: pragatix-backend
  main:
    banner-mode: "off"
    log-startup-info: false
  datasource:
    url: ${DB_URL}?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:57600000}
  student-expiration: ${JWT_STUDENT_EXPIRATION:57600000}

app:
  security:
    encryption:
      secret: ${DATABASE_ENCRYPTION_SECRET:PragatiXAES256GCMDatabaseEncryptionSecretKey2026!}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /api/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /api/swagger-ui.html
    tags-sorter: alpha

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
  level:
    root: WARN
    org.springframework: WARN
    org.springframework.boot: WARN
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.apache.catalina: WARN
    org.apache.tomcat: WARN
    com.zaxxer.hikari: WARN
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql: OFF
    org.hibernate: ERROR
    jjcet.PragatiX: INFO
    com.pragatix: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
  health:
    db:
      enabled: true

zepto:
  mail:
    url: ${ZEPTO_MAIL_URL}
    token: ${ZEPTO_MAIL_TOKEN}
    template-key: ${ZEPTO_MAIL_TEMPLATE_KEY}
    sender-address: ${ZEPTO_MAIL_SENDER_ADDRESS}
    sender-name: ${ZEPTO_MAIL_SENDER_NAME}

sms:
  provider: ${SMS_PROVIDER}
  test-endpoint-enabled: ${SMS_TEST_ENDPOINT_ENABLED}

airtel:
  sms:
    enabled: ${AIRTEL_SMS_ENABLED}
    url: ${AIRTEL_SMS_URL}
    customer-id: ${AIRTEL_CUSTOMER_ID}
    username: ${AIRTEL_USERNAME}
    password: ${AIRTEL_PASSWORD}
    dlt-template-id: ${AIRTEL_DLT_TEMPLATE_ID}
    entity-id: ${AIRTEL_ENTITY_ID}
    source-address: ${AIRTEL_SOURCE_ADDRESS}
    message-type: ${AIRTEL_MESSAGE_TYPE}