server:
  address: 0.0.0.0
  port: 8080

spring:
  application:
    name: spdms-backend

  datasource:
    url: jdbc:mysql://localhost:3307/spdms_lab?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: sharu
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  main:
    log-startup-info: false
    banner-mode: off

  security:
    user:
      name: admin
      password: admin

jwt:
  secret: spdms_super_secret_key_must_be_at_least_256_bits_long_for_hs256_algorithm
  expiration: 86400000
  student-expiration: 43200000

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:4200}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

logging:
  pattern:
    console: "%msg%n%ex"
  level:
    com.spdms: INFO
    org.springframework: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: WARN
    org.apache: WARN