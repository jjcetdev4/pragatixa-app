server:
  port: 8080
  forward-headers-strategy: framework
  tomcat:
    accesslog:
      enabled: true
      directory: /opt/pragatix/access-logs # Make sure this exists or override for Windows local testing
      prefix: access_log
      suffix: .log
      file-date-format: .yyyy-MM-dd
      pattern: '%h %l %u %t "%r" %s %b %D'
      rotate: true
      max-days: 7

spring:
  application:
    name: pragatix-backend # or spdms-backend
  datasource:
    url: jdbc:mysql://localhost:3307/spdms_lab?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: sharu
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  security:
    user:
      name: admin
      password: admin

jwt:
  secret: spdms_super_secret_key_must_be_at_least_256_bits_long_for_hs256_algorithm
  expiration: 57600000
  student-expiration: 57600000

app:
  security:
    encryption:
      secret: ${APP_ENCRYPTION_SECRET:PragatiXAES256GCMDatabaseEncryptionSecretKey2026!}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://pragatix.in,https://www.pragatix.in}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /api/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /api/swagger-ui.html
    tags-sorter: alpha

logging:
  level:
    com.pragatix: INFO
    jjcet.PragatiX: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.orm.jdbc.extract: OFF
    org.hibernate.type.descriptor.sql: OFF

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
  health:
    db:
      enabled: true

