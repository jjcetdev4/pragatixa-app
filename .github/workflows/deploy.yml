name: Deploy Latest Build (SSM)
 
on:
  workflow_dispatch: {}   # lets you manually redeploy the latest S3 jar without a new commit
  workflow_call: {}       # lets build-and-push.yml call this as its deploy step
 
permissions:
  id-token: write
  contents: read
 
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
 
      # Targets by tag, not a hardcoded instance ID — this is what makes it
      # work correctly whether the ASG currently has 1 instance or has
      # scaled to 2. Every instance the ASG launches needs App=spdms-backend
      # set in the Launch Template's tag specifications for this to find it.
      - name: Discover running backend instances
        id: discover
        run: |
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:App,Values=spdms-backend" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)
 
          if [ -z "$INSTANCE_IDS" ]; then
            echo "::error::No running instances found with tag App=spdms-backend"
            exit 1
          fi
 
          echo "Found instances: $INSTANCE_IDS"
          echo "instance_ids=$INSTANCE_IDS" >> "$GITHUB_OUTPUT"
 
      - name: Trigger deploy script via SSM and wait for completion
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:App,Values=spdms-backend" \
            --parameters 'commands=["sudo bash /opt/pragatix/deploy.sh"]' \
            --comment "SPDMS backend deploy — commit ${{ github.sha }}" \
            --query "Command.CommandId" \
            --output text)
 
          echo "SSM Command ID: $COMMAND_ID"
          FAILED=0
 
          for id in ${{ steps.discover.outputs.instance_ids }}; do
            echo "Waiting for deploy on instance $id..."
            if aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$id"; then
              echo "✅ Deploy succeeded on $id"
            else
              echo "::error::Deploy FAILED on instance $id"
              echo "---- stderr from $id ----"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$id" \
                --query "StandardErrorContent" --output text
              FAILED=1
            fi
          done
 
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::One or more instances failed to deploy — check output above."
            exit 1
          fi
