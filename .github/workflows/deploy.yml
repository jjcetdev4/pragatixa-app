name: Build and Push to S3
on:
  push:
    branches:
      - main
# Required for OIDC authentication
permissions:
  id-token: write
  contents: read
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare access-log deployment config
        run: |
          sudo mkdir -p /opt/pragatix/access-logs
          sudo chown ec2-user:ec2-user /opt/pragatix/access-logs || true
          cat > /tmp/spdms-backend.env <<'EOF'
          SERVER_TOMCAT_ACCESSLOG_ENABLED=true
          SERVER_TOMCAT_ACCESSLOG_DIRECTORY=/opt/pragatix/access-logs
          SERVER_TOMCAT_ACCESSLOG_PREFIX=access_log
          SERVER_TOMCAT_ACCESSLOG_SUFFIX=.log
          SERVER_TOMCAT_ACCESSLOG_FILE_DATE_FORMAT=.yyyy-MM-dd
          SERVER_TOMCAT_ACCESSLOG_PATTERN=%h %l %u %t "%r" %s %b %D
          SERVER_TOMCAT_ACCESSLOG_ROTATE=true
          SERVER_TOMCAT_ACCESSLOG_MAX_DAYS=7
          EOF
          cat > /tmp/spdms-backend-logrotate <<'EOF'
          /opt/pragatix/access-logs/access_log*.log /var/log/spdms-backend/application.log {
            daily
            rotate 14
            missingok
            notifempty
            copytruncate
          }
          EOF
          cat > /tmp/amazon-cloudwatch-agent.json <<'EOF'
          {
            "logs": {
              "logs_collected": {
                "files": {
                  "collect_list": [
                    {
                      "file_path": "/opt/pragatix/access-logs/access_log*.log",
                      "log_group_name": "/spdms/backend/access",
                      "log_stream_name": "access-{instance_id}",
                      "retention_in_days": 365,
                      "timezone": "Asia/Kolkata",
                      "timestamp_format": "[%d/%b/%Y:%H:%M:%S %z]"
                    }
                  ]
                }
              }
            }
          }
          EOF
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn clean package -DskipTests
      - name: Configure AWS Credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Push code to S3 bucket
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
          for file in target/*.jar; do
            filename=$(basename "$file")
            name="${filename%.*}"
            aws s3 cp "$file" "s3://${{ vars.S3_BUCKET_NAME }}/backend/${name}_${TIMESTAMP}.jar"
          done
