name: Build and Push to S3

on:
  push:
    branches:
      - main

# Required for OIDC authentication
permissions:
  id-token: write 
  contents: read  

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug OIDC claims
        run: |
          echo "Fetching OIDC token to inspect the sub claim..."
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "----- DECODED SUB CLAIM -----"
          echo "$TOKEN" | cut -d '.' -f2 | base64 -d 2>/dev/null | jq -r '.sub'
          echo "-----------------------------"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Configure AWS Credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::961408845745:role/jjcetpm-github-pipeline
          aws-region: ap-south-1

      - name: Push code to S3 bucket
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
          for file in target/*.jar; do
            filename=$(basename "$file")
            name="${filename%.*}"
            aws s3 cp "$file" "s3://${{ vars.S3_BUCKET_NAME }}/backend/${name}_${TIMESTAMP}.jar"
          done

      - name: Upload React build to S3
        run: |
          aws sts get-caller-identity
